<!DOCTYPE html>
<html lang="en" style="background-color: #1A1D23;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Authentication | VeriDex</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/components.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-panel">

      <div class="auth-left">
        <div class="auth-left-content">
          <svg width="64" height="64" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="authVdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F97316"/>
                <stop offset="100%" stop-color="#F59E0B"/>
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="6" fill="#22262E"/>
            <path d="M7 10L13 22L17 14" stroke="url(#authVdGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 10H21C23.76 10 26 12.24 26 15C26 17.76 23.76 20 21 20H17V10Z" stroke="url(#authVdGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div style="text-align:center;">
            <div style="font-size:28px;font-weight:700;letter-spacing:-0.5px;display:flex;align-items:center;justify-content:center;">
              <span style="color:#FFFFFF;">Veri</span><span style="color:var(--color-brand);">Dex</span>
            </div>
            <div style="font-size:11px;font-weight:600;color:var(--color-muted);letter-spacing:2px;margin-top:4px;">PLATFORM ARCHITECTURE</div>
          </div>
          <div class="auth-left-tagline">Trusted Intelligence. Insurance Transformed.</div>
        </div>
      </div>

      <div class="auth-right">
        <div class="auth-title">Welcome back</div>
        <div class="auth-subtitle">Sign in to your VeriDex workspace</div>

        <form id="login-form" onsubmit="handleLogin(event)">
          <div class="auth-form-group">
            <label class="auth-label" for="email">Email *</label>
            <input class="auth-input" type="email" id="email" name="email"
              placeholder="you@company.com" required autocomplete="email">
          </div>
          <div class="auth-form-group">
            <label class="auth-label" for="password">Password *</label>
            <input class="auth-input" type="password" id="password" name="password"
              placeholder="Enter your password" required autocomplete="current-password">
          </div>
          <div class="auth-form-group" style="margin-top:8px;display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="remember-me" style="width:16px;height:16px;accent-color:var(--color-brand);cursor:pointer;">
            <label for="remember-me" style="color:var(--color-muted);font-size:12px;cursor:pointer;margin:0;">Remember me for 30 days</label>
          </div>
          <button type="submit" class="auth-btn">Sign In →</button>
        </form>

        <div class="auth-link" onclick="VeriDexComponents.showToast('Password reset link sent (simulated)','info')">Forgot Password?</div>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      if (!email || !password) return;

      const allowed = ['carrier@gmail.com', 'mga@gmail.com', 'broker@gmail.com', 'insured@gmail.com'];
      if (!allowed.includes(email) || password !== 'admin@123') {
        VeriDexComponents.showToast('Invalid email or password. Please use admin@123.', 'error');
        return;
      }

      const rememberMe = document.getElementById('remember-me').checked;
      sessionStorage.setItem('login_email', email);
      sessionStorage.setItem('login_remember', rememberMe ? '1' : '0');
      window.location.href = 'otp.html';
    }
  </script>
</body>
</html>
